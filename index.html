<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PlainTerms — Fine-Print & Clause Workbench</title>
    <meta
      name="description"
      content="Interactive fine-print and clause workbench built for the Silicon Valley Buildathon. Highlight verbatim risks, read plain-English translations, and draft counter-emails."
    />
    <meta property="og:title" content="PlainTerms — Fine-Print & Clause Workbench" />
    <meta
      property="og:description"
      content="Interactive fine-print and clause workbench built for the Silicon Valley Buildathon. Highlight verbatim risks, read plain-English translations, and draft counter-emails."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("plainterms_theme_v1");
          var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (saved === "dark" || (!saved && prefersDark)) {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700&family=Public+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased selection:bg-blue-100 selection:text-slate-900 dark:selection:bg-blue-900/60 dark:selection:text-slate-100">

    <script type="module" src="/src/main.tsx"></script>
